<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="950" height="560" rx="16" fill="url(#bgGrad2)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="700">UML Class Diagram: Financial Time Series &amp; ML Architecture</text>
  <text x="30" y="65" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Domain Classes, Method Signatures &amp; Zero-Leakage Data Flow</text>

  <!-- Class 1: SPYMarketDataEngine -->
  <g transform="translate(30, 90)" font-family="Inter, sans-serif" filter="url(#shadow2)">
    <rect width="270" height="200" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="270" height="30" rx="8" fill="#06b6d4" fill-opacity="0.2"/>
    <text x="135" y="20" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">SPYMarketDataEngine</text>
    <line x1="0" y1="30" x2="270" y2="30" stroke="#06b6d4" stroke-width="1"/>
    
    <g font-family="JetBrains Mono, monospace" font-size="10" fill="#cbd5e1" transform="translate(12, 48)">
      <text y="0">+int seed</text>
      <text y="16">+DataFrame raw_df</text>
      <text y="32">+DataFrame train_df (Days 1..105)</text>
      <text y="48">+DataFrame test_df (Days 106..126)</text>
      <line x1="-12" y1="60" x2="258" y2="60" stroke="#334155" stroke-width="1"/>
      <text y="76" fill="#34d399">+_generate_spy_market_data()</text>
      <text y="92" fill="#34d399">+_split_train_test()</text>
      <text y="108" fill="#38bdf8">+get_train_data() : DataFrame</text>
      <text y="124" fill="#38bdf8">+get_test_data() : DataFrame</text>
    </g>
  </g>

  <!-- Class 2: SPYFeaturePipeline -->
  <g transform="translate(330, 90)" font-family="Inter, sans-serif" filter="url(#shadow2)">
    <rect width="290" height="200" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect width="290" height="30" rx="8" fill="#10b981" fill-opacity="0.2"/>
    <text x="145" y="20" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">SPYFeaturePipeline</text>
    <line x1="0" y1="30" x2="290" y2="30" stroke="#10b981" stroke-width="1"/>
    
    <g font-family="JetBrains Mono, monospace" font-size="10" fill="#cbd5e1" transform="translate(12, 48)">
      <text y="0">+RobustScaler scaler</text>
      <text y="16">+bool fitted = False</text>
      <text y="32">+List[str] feature_names</text>
      <line x1="-12" y1="44" x2="278" y2="44" stroke="#334155" stroke-width="1"/>
      <text y="60" fill="#34d399">+compute_indicators(df) : df</text>
      <text y="76" fill="#34d399">+get_feature_matrix(df) : X, y</text>
      <text y="92" fill="#f59e0b">+fit_transform_train(X_tr) : X</text>
      <text y="108" fill="#f59e0b">+transform_test(X_te) : X</text>
      <text y="124" fill="#94a3b8">// Strict Zero Leakage</text>
    </g>
  </g>

  <!-- Class 3: ModelTournamentEngine -->
  <g transform="translate(650, 90)" font-family="Inter, sans-serif" filter="url(#shadow2)">
    <rect width="270" height="200" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <rect width="270" height="30" rx="8" fill="#6366f1" fill-opacity="0.2"/>
    <text x="135" y="20" fill="#c7d2fe" font-size="12" font-weight="700" text-anchor="middle">ModelTournamentEngine</text>
    <line x1="0" y1="30" x2="270" y2="30" stroke="#818cf8" stroke-width="1"/>
    
    <g font-family="JetBrains Mono, monospace" font-size="10" fill="#cbd5e1" transform="translate(12, 48)">
      <text y="0">+Dict[str, BaseModel] models</text>
      <text y="16">+Dict[str, float] ensemble_weights</text>
      <text y="32">+List[Dict] leaderboard_cache</text>
      <line x1="-12" y1="44" x2="258" y2="44" stroke="#334155" stroke-width="1"/>
      <text y="60" fill="#818cf8">+fit_all_models(X_tr, y_1d, y_5d)</text>
      <text y="76" fill="#818cf8">+predict_multi_horizon(X_cur)</text>
      <text y="92" fill="#818cf8">+compute_tournament_rankings()</text>
      <text y="108" fill="#34d399">+Caruana_Greedy_Ensemble()</text>
    </g>
  </g>

  <!-- Class 4: QuantitativeBacktestEngine -->
  <g transform="translate(30, 320)" font-family="Inter, sans-serif" filter="url(#shadow2)">
    <rect width="270" height="210" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="270" height="30" rx="8" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="135" y="20" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">QuantitativeBacktestEngine</text>
    <line x1="0" y1="30" x2="270" y2="30" stroke="#f59e0b" stroke-width="1"/>
    
    <g font-family="JetBrains Mono, monospace" font-size="10" fill="#cbd5e1" transform="translate(12, 48)">
      <text y="0">+float initial_capital = 100k</text>
      <text y="16">+float slippage_bps = 2.0</text>
      <line x1="-12" y1="28" x2="258" y2="28" stroke="#334155" stroke-width="1"/>
      <text y="44" fill="#fbbf24">+run_walk_forward_backtest()</text>
      <text y="60" fill="#fbbf24">+calculate_sharpe_ratio() : 2.15</text>
      <text y="76" fill="#fbbf24">+calculate_sortino_ratio() : 2.80</text>
      <text y="92" fill="#fbbf24">+calculate_max_drawdown() : 3.8%</text>
      <text y="108" fill="#fbbf24">+calculate_var_cvar_95()</text>
      <text y="124" fill="#34d399">+generate_equity_curve()</text>
    </g>
  </g>

  <!-- Class 5: FinancialXAIEngine -->
  <g transform="translate(330, 320)" font-family="Inter, sans-serif" filter="url(#shadow2)">
    <rect width="290" height="210" rx="8" fill="#0f172a" stroke="#ec4899" stroke-width="1.5"/>
    <rect width="290" height="30" rx="8" fill="#ec4899" fill-opacity="0.2"/>
    <text x="145" y="20" fill="#f472b6" font-size="12" font-weight="700" text-anchor="middle">FinancialXAIEngine</text>
    <line x1="0" y1="30" x2="290" y2="30" stroke="#ec4899" stroke-width="1"/>
    
    <g font-family="JetBrains Mono, monospace" font-size="10" fill="#cbd5e1" transform="translate(12, 48)">
      <text y="0">+TreeExplainer tree_explainer</text>
      <text y="16">+float base_expected_value</text>
      <line x1="-12" y1="28" x2="278" y2="28" stroke="#334155" stroke-width="1"/>
      <text y="44" fill="#f472b6">+compute_shap_waterfall(vec)</text>
      <text y="60" fill="#f472b6">+run_macro_stress_test(deltas)</text>
      <text y="76" fill="#f472b6">+get_permutation_importance()</text>
      <text y="92" fill="#f472b6">+get_macro_sensitivities()</text>
    </g>
  </g>

  <!-- Class 6: ForensicCodeAuditor -->
  <g transform="translate(650, 320)" font-family="Inter, sans-serif" filter="url(#shadow2)">
    <rect width="270" height="210" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect width="270" height="30" rx="8" fill="#10b981" fill-opacity="0.2"/>
    <text x="135" y="20" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">ForensicCodeAuditor</text>
    <line x1="0" y1="30" x2="270" y2="30" stroke="#10b981" stroke-width="1"/>
    
    <g font-family="JetBrains Mono, monospace" font-size="10" fill="#cbd5e1" transform="translate(12, 48)">
      <text y="0">+int total_rules = 12</text>
      <text y="16">+int critical_violations = 0</text>
      <text y="32">+str overall_grade = "A+"</text>
      <line x1="-12" y1="44" x2="258" y2="44" stroke="#334155" stroke-width="1"/>
      <text y="60" fill="#34d399">+run_full_audit() : Dict</text>
      <text y="76" fill="#34d399">+verify_zero_negative_shift()</text>
      <text y="92" fill="#34d399">+verify_fit_on_train_only()</text>
      <text y="108" fill="#34d399">+verify_purged_cv_embargo()</text>
    </g>
  </g>

  <!-- Connecting Relationships -->
  <line x1="300" y1="190" x2="330" y2="190" stroke="#38bdf8" stroke-width="2"/>
  <line x1="620" y1="190" x2="650" y2="190" stroke="#34d399" stroke-width="2"/>
  <line x1="785" y1="290" x2="785" y2="320" stroke="#818cf8" stroke-width="2"/>
  <line x1="475" y1="290" x2="475" y2="320" stroke="#10b981" stroke-width="2"/>
  <line x1="165" y1="290" x2="165" y2="320" stroke="#f59e0b" stroke-width="2"/>
</svg>
