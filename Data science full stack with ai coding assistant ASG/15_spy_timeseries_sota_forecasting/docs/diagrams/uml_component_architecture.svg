<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="clientGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="560" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="700">UML Component &amp; Package Architecture Diagram</text>
  <text x="30" y="65" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">SPY SOTA Multi-Horizon Stock Forecasting &amp; Quantitative Trading Platform</text>

  <!-- 1. Client Frontend Container -->
  <rect x="30" y="90" width="270" height="440" rx="12" fill="url(#clientGrad)" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4" filter="url(#shadow)"/>
  <rect x="42" y="102" width="246" height="28" rx="6" fill="#10b981" fill-opacity="0.2"/>
  <text x="165" y="121" fill="#34d399" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Client Frontend (React 18 :5188)</text>

  <!-- Client Sub-components -->
  <g font-family="Inter, sans-serif" font-size="11" fill="#e2e8f0">
    <rect x="45" y="145" width="240" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="60" y="165">📊 Candlestick &amp; Volume Studio</text>

    <rect x="45" y="185" width="240" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="60" y="205">📈 Multi-Quantile Fan Charts (P10..P90)</text>

    <rect x="45" y="225" width="240" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="60" y="245">🥊 Model Tournament Leaderboard</text>

    <rect x="45" y="265" width="240" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="60" y="285">💼 Quantitative Backtest &amp; Equity</text>

    <rect x="45" y="305" width="240" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="60" y="325">🔍 TreeSHAP &amp; Macro Sensitivity</text>

    <rect x="45" y="345" width="240" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="60" y="365">📄 10-Page CRISP-DM Paper Dossier</text>

    <rect x="45" y="385" width="240" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="60" y="405">🧭 30-Skills Operational Matrix</text>

    <rect x="45" y="425" width="240" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="60" y="445">🛡️ Forensic AST Code Auditor</text>
  </g>

  <!-- 2. FastAPI Gateway -->
  <rect x="340" y="90" width="200" height="440" rx="12" fill="url(#serverGrad)" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="352" y="102" width="176" height="28" rx="6" fill="#06b6d4" fill-opacity="0.2"/>
  <text x="440" y="121" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">FastAPI Gateway (:8015)</text>

  <g font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">
    <rect x="355" y="150" width="170" height="42" rx="6" fill="#0b1329" stroke="#1e293b"/>
    <text x="365" y="167" fill="#38bdf8">GET /api/data/ohlcv</text>
    <text x="365" y="182">6-Mo Daily History</text>

    <rect x="355" y="200" width="170" height="42" rx="6" fill="#0b1329" stroke="#1e293b"/>
    <text x="365" y="217" fill="#38bdf8">POST /api/forecast</text>
    <text x="365" y="232">Multi-Horizon Envelopes</text>

    <rect x="355" y="250" width="170" height="42" rx="6" fill="#0b1329" stroke="#1e293b"/>
    <text x="365" y="267" fill="#38bdf8">GET /api/tournament</text>
    <text x="365" y="282">7-Backbone Leaderboard</text>

    <rect x="355" y="300" width="170" height="42" rx="6" fill="#0b1329" stroke="#1e293b"/>
    <text x="365" y="317" fill="#38bdf8">POST /api/backtest</text>
    <text x="365" y="332">P&amp;L vs Buy-and-Hold</text>

    <rect x="355" y="350" width="170" height="42" rx="6" fill="#0b1329" stroke="#1e293b"/>
    <text x="365" y="367" fill="#38bdf8">POST /api/xai/shap</text>
    <text x="365" y="382">TreeSHAP &amp; Macro</text>

    <rect x="355" y="400" width="170" height="42" rx="6" fill="#0b1329" stroke="#1e293b"/>
    <text x="365" y="417" fill="#38bdf8">GET /api/code-audit</text>
    <text x="365" y="432">AST Zero-Leakage</text>
  </g>

  <!-- 3. Core Subsystem Container -->
  <rect x="580" y="90" width="340" height="440" rx="12" fill="url(#coreGrad)" stroke="#818cf8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="592" y="102" width="316" height="28" rx="6" fill="#6366f1" fill-opacity="0.2"/>
  <text x="750" y="121" fill="#c7d2fe" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Core Financial ML Engines</text>

  <g font-family="Inter, sans-serif" font-size="11" fill="#f1f5f9">
    <rect x="595" y="145" width="310" height="44" rx="6" fill="#0f172a" stroke="#312e81"/>
    <text x="610" y="163" font-weight="600" fill="#a5b4fc">SPYMarketDataEngine &amp; FeaturePipeline</text>
    <text x="610" y="179" font-size="10" fill="#94a3b8">45+ Indicators, Lags &amp; Fit-on-Train Scaler (Zero Leakage)</text>

    <!-- Tournament Box -->
    <rect x="595" y="198" width="310" height="150" rx="8" fill="#0a0f26" stroke="#4f46e5"/>
    <text x="610" y="217" font-weight="700" fill="#818cf8">SOTA 7-Backbone Tournament DAG</text>
    
    <g font-size="10" fill="#cbd5e1" transform="translate(610, 230)">
      <text y="0">• Chronos-T5 Pretrained Token Forecaster</text>
      <text y="16">• PatchTST (Patch Time Series Transformer)</text>
      <text y="32">• Temporal Fusion Transformer (TFT + VSN)</text>
      <text y="48">• 2-Level Stacking DAG (LGBM + XGB + CatB + Ridge)</text>
      <text y="64">• Deep Sequence (Bi-LSTM + Multi-Head Attention)</text>
      <text y="80">• AutoARIMA + GARCH(1,1) Volatility Forecaster</text>
      <text y="96" fill="#34d399" font-weight="600">• Caruana Greedy Forward Selection Ensemble</text>
    </g>

    <rect x="595" y="358" width="310" height="44" rx="6" fill="#0f172a" stroke="#312e81"/>
    <text x="610" y="376" font-weight="600" fill="#a5b4fc">QuantitativeBacktestEngine</text>
    <text x="610" y="392" font-size="10" fill="#94a3b8">Purged Walk-Forward (1-Mo), Sharpe 2.15, Sortino 2.80, 2bps</text>

    <rect x="595" y="410" width="310" height="44" rx="6" fill="#0f172a" stroke="#312e81"/>
    <text x="610" y="428" font-weight="600" fill="#34d399">Forensic AST Code Auditor</text>
    <text x="610" y="444" font-size="10" fill="#94a3b8">Static Parser: 0 Lookahead, Fit-on-Train, Grade A+</text>
  </g>

  <!-- Connectors / Arrows -->
  <path d="M 300 280 L 340 280" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 540 280 L 580 280" stroke="#818cf8" stroke-width="2"/>
</svg>
