# Production-like data plane for local verification of the MCP Toolbox path:
# PostgreSQL (schema + seed) and MCP Toolbox for Databases serving the commerce and bug
# tracker tools. The ADK agents run on the host:
#   docker compose up -d
#   ECOMMERCE_BACKEND=toolbox TOOLBOX_URL=http://127.0.0.1:5000 adk web agents
# Credentials below are LOCAL-ONLY development values for a throw-away container.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_PG_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./database/postgres/ecommerce_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/postgres/ecommerce_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./database/postgres/init_bug_tracker.sh:/docker-entrypoint-initdb.d/03_bugs.sh:ro
      - ./database/postgres/bug_tracker_schema.sql:/seed/bug_tracker_schema.sql:ro
      - ./database/postgres/bug_tracker_seed.sql:/seed/bug_tracker_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d store"]
      interval: 5s
      retries: 10

  toolbox-commerce:
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:1.15.0
    platform: linux/amd64
    command: ["--config", "/config/ecommerce_tools.yaml", "--address", "0.0.0.0"]
    environment: &toolbox_env
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: store
      BUG_DB_NAME: bugs
      DB_USER: postgres
      DB_PASSWORD: ${LOCAL_PG_PASSWORD:-local-dev-only}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-replace-me.apps.googleusercontent.com}
    volumes:
      - ./configs/toolbox:/config:ro
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy

  toolbox-bugs:
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:1.15.0
    platform: linux/amd64
    command: ["--config", "/config/bug_tracker_tools.yaml", "--address", "0.0.0.0"]
    environment: *toolbox_env
    volumes:
      - ./configs/toolbox:/config:ro
    ports:
      - "127.0.0.1:5001:5000"
    depends_on:
      db:
        condition: service_healthy
