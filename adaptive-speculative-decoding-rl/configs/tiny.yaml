# Fast real-model run (any Mac, even 8 GB): SmolLM2 360M target, 135M draft (shared tokenizer).
# Expect roughly 1-3 hours end to end on an M1/M2; trace building dominates.
name: smollm2-360m-135m
out_dir: results/smollm2-360m-135m
models:
  target: HuggingFaceTB/SmolLM2-360M-Instruct
  draft: HuggingFaceTB/SmolLM2-135M-Instruct
  device: auto
  dtype: auto
data:
  train: [humaneval]
  val: [humaneval]
  test: [mtbench, gsm8k, alpaca, nq]
  n_train: 100
  n_val: 24
  n_test_per_set: 30
  max_prompt_tokens: 512
decode:
  max_new_tokens: 160
  dmax: 12
train:
  total_timesteps: 300000
  eval_every: 20000
