[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ltdmini"
version = "0.1.0"
description = "Learning to Draft, on a laptop: a small-scale, zero-cost replication of adaptive speculative decoding with reinforcement learning (Zhang et al., ICLR 2026)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dev Mulchandani" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyyaml>=6", "matplotlib>=3.8"]

[project.optional-dependencies]
models = ["torch>=2.3", "transformers>=4.45", "datasets>=2.19", "accelerate>=0.33"]
train = ["torch>=2.3", "gymnasium>=0.29", "stable-baselines3>=2.3"]
dev = ["pytest>=8", "ruff>=0.5", "scipy>=1.11"]
all = ["ltdmini[models,train,dev]"]

[project.scripts]
ltdmini = "ltdmini.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
